<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Messenger Pro</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="login-screen">
        <div class="bg-blur-circle"></div>
        <div class="login-box">
            <div class="lock-icon">🔒</div>
            <h2>Welcome Back</h2>
            <p>Enter your credentials to access secure relay</p>
            
            <div class="input-group">
                <input type="text" id="usernameInput" placeholder="Username" required>
            </div>
            <div class="input-group">
                <input type="password" id="keyInput" placeholder="Secret Auth Key" required>
            </div>
            
            <button id="loginBtn" class="primary-btn">ENTER SYSTEM</button>
            <div class="login-footer">End-to-End Encrypted Node</div>
        </div>
    </div>

    <div id="main-container" style="display: none;">
        </div>

    <script src="encryption.js"></script>
    <script src="main.js"></script>
</body>
</html>

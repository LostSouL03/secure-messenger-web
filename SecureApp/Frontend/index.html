<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Messenger Pro</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <button id="theme-toggle">🌓 Theme</button>

    <div id="video-container">
        <video id="remoteVideo" autoplay playsinline></video>
        <video id="localVideo" autoplay playsinline muted></video>
        <div class="call-controls">
            <button id="hangupBtn" class="call-btn-end">✖</button>
        </div>
    </div>

    <div id="login-screen">
        <div class="login-box">
            <h2>Secure Login</h2>
            <input type="text" id="usernameInput" placeholder="Username">
            <input type="password" id="keyInput" placeholder="Secret Auth Key">
            <button id="loginBtn" class="primary-btn">ENTER</button>
        </div>
    </div>

    <div id="main-container">
        <div id="sidebar">
            <div class="sidebar-header">CHATS</div>
            <div class="sidebar-item">🔒 Secure Relay</div>
        </div>

        <div id="chat-window">
            <div class="chat-header">
                <div class="header-info">
                    <button id="sidebar-toggle">☰</button>
                    <span>Active Room</span>
                </div>
                <button id="callBtn" class="call-trigger">📞 Start Call</button>
            </div>
            
            <div id="messages"></div>
            <div id="typing-indicator"></div>

            <div class="input-area">
                <button class="icon-btn" id="attachBtn">📎</button>
                <input type="file" id="fileInput" style="display:none">
                <button id="recordBtn" class="icon-btn">🎤</button>
                <input type="text" id="messageInput" placeholder="Message...">
                <button id="sendBtn" class="primary-btn">SEND</button>
            </div>
        </div>
    </div>

    <script src="encryption.js"></script>
    <script src="app.js"></script>
</body>
</html>

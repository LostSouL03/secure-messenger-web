<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Messenger Pro</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="login-screen">
        <div class="bg-blur-circle"></div>
        <div class="login-box">
            <div class="lock-icon">🔒</div>
            <h2>Secure Access</h2>
            <p>Connect to the encrypted relay node</p>
            <input type="text" id="usernameInput" placeholder="Username">
            <input type="password" id="keyInput" placeholder="Secret Auth Key">
            <button id="loginBtn" class="primary-btn">ENTER SYSTEM</button>
        </div>
    </div>

    <div id="main-container" style="display: none;">
        <div id="sidebar">
            <div class="sidebar-header">
                <div class="header-top">
                    <span>CHATS <small id="relay-badge">🔒 Secure</small></span>
                    <button id="gear-btn" onclick="openSettings()">⚙️</button>
                </div>
            </div>
            <div id="contact-list"></div>
        </div>
        
        <div id="chat-window">
            <div class="chat-header">
                <span id="active-chat-user"></span>
                <button id="callBtn" class="call-trigger" style="display: none;">📞 Call</button>
            </div>
            <div id="messages"></div>
            <div class="input-area">
                <button class="icon-btn" id="attachBtn">📎</button>
                <input type="file" id="fileInput" style="display:none">
                <button class="icon-btn" id="recordBtn">🎤</button>
                <input type="text" id="messageInput" placeholder="Type a message">
                <button id="sendBtn" class="send-btn">SEND</button>
            </div>
        </div>
    </div>

    <div id="settings-overlay" style="display:none;">
        <div class="settings-box">
            <h3>Settings</h3>
            <button onclick="localStorage.clear(); location.reload();" class="danger-btn">Clear All Data</button>
            <button onclick="document.getElementById('settings-overlay').style.display='none'" class="primary-btn" style="margin-top:10px;">Close</button>
        </div>
    </div>

    <script src="encryption.js"></script>
    <script src="app.js"></script>
</body>
</html>

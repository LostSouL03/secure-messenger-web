<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Messenger</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔒</text></svg>">
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #121212; color: white; display: flex; flex-direction: column; height: 100vh; margin: 0; }
        #login-screen { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; }
        #chat-screen { display: none; flex-direction: column; height: 100%; }
        #messages { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 10px; }
        .message { max-width: 70%; padding: 10px; border-radius: 10px; word-wrap: break-word; position: relative; }
        .my-message { align-self: flex-end; background-color: #005c4b; }
        .partner-message { align-self: flex-flex-start; background-color: #202c33; }
        .timestamp { font-size: 0.7em; opacity: 0.6; margin-left: 8px; vertical-align: bottom; }
        #typing-indicator { color: #888; font-size: 0.8em; height: 1.2em; margin-left: 20px; margin-bottom: 5px; }
        .input-area { padding: 20px; background-color: #202c33; display: flex; gap: 10px; }
        input { padding: 10px; border: none; border-radius: 5px; background: #2a3942; color: white; }
        button { padding: 10px 20px; border: none; border-radius: 5px; background: #00a884; color: white; cursor: pointer; }
        input:focus { outline: none; }
    </style>
</head>
<body>

    <div id="login-screen">
        <h2>Secure Session Login</h2>
        <input type="text" id="usernameInput" placeholder="Username" style="margin-bottom:10px; width: 250px;"><br>
        <input type="password" id="keyInput" placeholder="Secret Auth Key" style="margin-bottom:20px; width: 250px;"><br>
        <button onclick="joinSession()">Start Secure Session</button>
    </div>

    <div id="chat-screen">
        <div id="messages"></div>
        <div id="typing-indicator"></div>
        <div class="input-area">
            <input type="text" id="messageInput" placeholder="Type a message..." style="flex:1">
            <button onclick="sendTextMessage()">Send</button>
        </div>
    </div>

    <script>
        let ws;
        let myUsername = "";
        let secretKey = "";
        let typingTimeout;

        async function deriveKey(password) {
            const encoder = new TextEncoder();
            const data = encoder.encode(password);
            const hash = await crypto.subtle.digest('SHA-256', data);
            return await crypto.subtle.importKey('raw', hash, { name: 'AES-GCM' }, false, ['encrypt', 'decrypt']);
        }

        async function encryptMessage(text) {
            const key = await deriveKey(secretKey);
            const iv = crypto.getRandomValues(new Uint8Array(12));
            const encodedText = new TextEncoder().encode(text);
            const ciphertext = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, encodedText);
            const combined = new Uint8Array(iv.length + ciphertext.byteLength);
            combined.set(iv);
            combined.set(new Uint8Array(ciphertext), iv.length);
            return btoa(String.fromCharCode(...combined));
        }

        async function decryptMessage(data) {
            try {
                const key = await deriveKey(secretKey);
                const binary = Uint8Array.from(atob(data), c => c.charCodeAt(0));
                const iv = binary.slice(0, 12);
                const ciphertext = binary.slice(12);
                const decrypted = await crypto.subtle.decrypt({ name: 'AES-GCM', iv }, key, ciphertext);
                return new TextDecoder().decode(decrypted);
            } catch (e) { return null; }
        }

        function joinSession() {
            // Request Notification Permission
            if ("Notification" in window) Notification.requestPermission();

            myUsername = document.getElementById("usernameInput").value.trim() || "Anonymous";
            secretKey = document.getElementById("keyInput").value;
            if (!secretKey) return alert("Key required!");

            const protocol = window.location.protocol === "https:" ? "wss://" : "ws://";
            ws = new WebSocket(`${protocol}${window.location.host}/ws`);

            ws.onopen = () => {
                document.getElementById("login-screen").style.display = "none";
                document.getElementById("chat-screen").style.display = "flex";
            };

            ws.onmessage = async (event) => {
                const decrypted = await decryptMessage(event.data);
                if (!decrypted) return;
                const data = JSON.parse(decrypted);

                if (data.type === "typing") {
                    handleTypingUI(data.user);
                } else {
                    renderMessage(data.user, data.content, "partner-message", data.time);
                    if (Notification.permission === "granted" && !document.hasFocus()) {
                        new Notification(`Message from ${data.user}`, { body: data.content });
                    }
                }
            };
        }

        function handleTypingUI(user) {
            const el = document.getElementById("typing-indicator");
            el.innerText = `${user} is typing...`;
            clearTimeout(typingTimeout);
            typingTimeout = setTimeout(() => el.innerText = "", 2000);
        }

        document.getElementById("messageInput").addEventListener("input", () => {
            if (ws && ws.readyState === WebSocket.OPEN) {
                encryptMessage(JSON.stringify({type: "typing", user: myUsername})).then(enc => ws.send(enc));
            }
        });

        async function sendTextMessage() {
            const input = document.getElementById("messageInput");
            const text = input.value.trim();
            if (!text || !ws) return;

            const time = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            const payload = JSON.stringify({ user: myUsername, content: text, type: "text", time: time });
            const encrypted = await encryptMessage(payload);
            ws.send(encrypted);
            renderMessage("You", text, "my-message", time);
            input.value = "";
        }

        function renderMessage(user, content, className, time) {
            const div = document.createElement("div");
            div.className = `message ${className}`;
            div.innerHTML = `<strong>${user}:</strong> ${content} <span class="timestamp">${time}</span>`;
            document.getElementById("messages").appendChild(div);
            document.getElementById("messages").scrollTop = document.getElementById("messages").scrollHeight;
            document.getElementById("typing-indicator").innerText = "";
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Messenger Pro + Video</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔒</text></svg>">
    <style>
        :root { --bg: #121212; --text: #ffffff; --panel: #202c33; --input: #2a3942; --accent: #00a884; --my-msg: #005c4b; --p-msg: #202c33; --border: rgba(255,255,255,0.1); --danger: #ff4b2b; }
        [data-theme="light"] { --bg: #f0f2f5; --text: #111b21; --panel: #ffffff; --input: #ffffff; --accent: #00a884; --my-msg: #d9fdd3; --p-msg: #ffffff; --border: rgba(0,0,0,0.1); --danger: #ff4b2b; }
        
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); margin: 0; display: flex; flex-direction: column; height: 100vh; transition: 0.3s; overflow: hidden; }
        
        /* Video Call Overlay */
        #video-container { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: black; z-index: 2000; flex-direction: column; align-items: center; justify-content: center; }
        #remoteVideo { width: 100%; height: 100%; object-fit: cover; }
        #localVideo { width: 150px; height: 110px; position: absolute; bottom: 80px; right: 20px; border: 2px solid var(--accent); border-radius: 10px; background: #222; transform: scaleX(-1); }
        .call-controls { position: absolute; bottom: 20px; display: flex; gap: 20px; }
        .call-btn { width: 50px; height: 50px; border-radius: 50%; border: none; cursor: pointer; font-size: 1.2rem; display: flex; align-items: center; justify-content: center; }
        .hangup { background: var(--danger); color: white; }

        /* Existing Styles... */
        .status-container { display: flex; align-items: center; gap: 8px; font-size: 0.85em; margin-bottom: 20px; opacity: 0.8; }
        .status-light { width: 10px; height: 10px; border-radius: 50%; background: #555; }
        .status-green { background: var(--accent); box-shadow: 0 0 8px var(--accent); }
        
        #main-container { display: flex; flex: 1; overflow: hidden; display: none; }
        #sidebar { width: 260px; background: var(--panel); border-right: 1px solid var(--border); display: flex; flex-direction: column; transition: 0.3s; }
        #sidebar.minimized { width: 0; overflow: hidden; }
        
        #chat-window { flex: 1; display: flex; flex-direction: column; background: var(--bg); border-left: 1px solid var(--border); }
        #messages { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 10px; border: 1px solid var(--border); margin: 10px; border-radius: 12px; }
        
        .message { max-width: 75%; padding: 10px; border-radius: 10px; position: relative; box-shadow: 0 1px 1px rgba(0,0,0,0.2); }
        .my-message { align-self: flex-end; background: var(--my-msg); }
        .partner-message { align-self: flex-start; background: var(--p-msg); }
        
        #theme-toggle { position: fixed; top: 10px; right: 10px; z-index: 1000; padding: 8px 15px; border-radius: 20px; cursor: pointer; background: var(--accent); color: white; border: none; }
        .input-area { padding: 15px; background: var(--panel); display: flex; align-items: center; gap: 10px; border-top: 1px solid var(--border); }
        input { padding: 10px; border-radius: 8px; border: 1px solid var(--border); background: var(--input); color: var(--text); }
        .icon-btn { background: none; border: none; font-size: 1.5rem; cursor: pointer; color: var(--accent); }
        
        #login-screen { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; }
        img.chat-img { max-width: 100%; border-radius: 5px; }
    </style>
</head>
<body>

    <button id="theme-toggle" onclick="toggleTheme()">🌓 Theme</button>

    <div id="video-container">
        <video id="remoteVideo" autoplay playsinline></video>
        <video id="localVideo" autoplay playsinline muted></video>
        <div class="call-controls">
            <button class="call-btn hangup" onclick="endCall()">📞</button>
        </div>
    </div>

    <div id="login-screen">
        <h2>Secure Login</h2>
        <div class="status-container">
            <div id="status-dot" class="status-light"></div>
            <span id="status-text">Notifications: Checking...</span>
        </div>
        <input type="text" id="usernameInput" placeholder="Username" style="width: 250px; margin-bottom: 10px;">
        <input type="password" id="keyInput" placeholder="Secret Auth Key" style="width: 250px; margin-bottom: 20px;">
        <button onclick="joinSession()" style="background: var(--accent); color: white; border: none; padding: 10px 40px; border-radius: 5px; cursor: pointer;">Start</button>
    </div>

    <div id="main-container">
        <div id="sidebar">
            <div style="padding:15px; font-weight:bold; border-bottom:1px solid var(--border);">Active Chats</div>
            <div style="padding:15px; background:var(--accent); color:white; margin:5px; border-radius:8px;">🔒 Relay Session</div>
        </div>

        <div id="chat-window">
            <div style="padding: 10px; display: flex; align-items: center; justify-content: space-between;">
                <div style="display:flex; align-items:center; gap:10px;">
                    <button onclick="toggleSidebar()" style="background:none; border:none; color:var(--accent); font-size: 1.5em; cursor:pointer;">☰</button>
                    <h4 style="margin:0">Secure Room</h4>
                </div>
                <button class="icon-btn" onclick="startCall()" title="Start Video Call">📞</button>
            </div>
            <div id="messages"></div>
            <div id="typing-indicator" style="padding:5px 20px; color:var(--accent); font-size:0.8em; height:15px;"></div>
            <div class="input-area">
                <button class="icon-btn" onclick="document.getElementById('fileInput').click()">📎</button>
                <input type="file" id="fileInput" style="display:none" onchange="sendFile()">
                <button id="recordBtn" class="icon-btn" onclick="toggleRecording()">🎤</button>
                <input type="text" id="messageInput" placeholder="Type a message..." style="flex:1">
                <button onclick="sendTextMessage()" style="background: var(--accent); color: white; border: none; padding: 10px 20px; border-radius: 8px;">Send</button>
            </div>
        </div>
    </div>

    <script>
        let ws, myUsername, secretKey, pc, localStream, typingTimeout;
        const config = { iceServers: [{ urls: "stun:stun.l.google.com:19302" }] };

        // --- THEME & STATUS ---
        function toggleTheme() {
            const t = document.documentElement.getAttribute('data-theme') === 'light' ? 'dark' : 'light';
            document.documentElement.setAttribute('data-theme', t);
            localStorage.setItem('theme', t);
        }
        document.documentElement.setAttribute('data-theme', localStorage.getItem('theme') || 'dark');

        function updateStatusLight() {
            const dot = document.getElementById("status-dot"), text = document.getElementById("status-text");
            if (Notification.permission === "granted") { text.innerText = "Ready"; dot.className = "status-light status-green"; }
            else { text.innerText = "Click Start to enable alerts"; }
        }
        window.onload = updateStatusLight;

        // --- ENCRYPTION ---
        async function deriveKey(pw) {
            const hash = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(pw));
            return await crypto.subtle.importKey('raw', hash, { name: 'AES-GCM' }, false, ['encrypt', 'decrypt']);
        }
        async function encrypt(text) {
            const key = await deriveKey(secretKey), iv = crypto.getRandomValues(new Uint8Array(12));
            const enc = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, new TextEncoder().encode(text));
            const comb = new Uint8Array(iv.length + enc.byteLength);
            comb.set(iv); comb.set(new Uint8Array(enc), iv.length);
            return btoa(String.fromCharCode(...comb));
        }
        async function decrypt(data) {
            try {
                const key = await deriveKey(secretKey), bin = Uint8Array.from(atob(data), c => c.charCodeAt(0));
                const dec = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: bin.slice(0, 12) }, key, bin.slice(12));
                return new TextDecoder().decode(dec);
            } catch (e) { return null; }
        }

        // --- WEBRTC VIDEO CALL LOGIC ---
        async function startCall() {
            document.getElementById("video-container").style.display = "flex";
            localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
            document.getElementById("localVideo").srcObject = localStream;

            pc = new RTCPeerConnection(config);
            localStream.getTracks().forEach(track => pc.addTrack(track, localStream));

            pc.onicecandidate = e => {
                if (e.candidate) sendSignal({ type: "candidate", candidate: e.candidate });
            };
            pc.ontrack = e => {
                document.getElementById("remoteVideo").srcObject = e.streams[0];
            };

            const offer = await pc.createOffer();
            await pc.setLocalDescription(offer);
            sendSignal({ type: "offer", offer });
        }

        async function handleSignal(data) {
            if (data.type === "offer") {
                if (!confirm(`${data.user} is calling you. Answer?`)) return;
                document.getElementById("video-container").style.display = "flex";
                localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
                document.getElementById("localVideo").srcObject = localStream;
                
                pc = new RTCPeerConnection(config);
                localStream.getTracks().forEach(track => pc.addTrack(track, localStream));
                pc.onicecandidate = e => { if (e.candidate) sendSignal({ type: "candidate", candidate: e.candidate }); };
                pc.ontrack = e => { document.getElementById("remoteVideo").srcObject = e.streams[0]; };

                await pc.setRemoteDescription(new RTCSessionDescription(data.offer));
                const answer = await pc.createAnswer();
                await pc.setLocalDescription(answer);
                sendSignal({ type: "answer", answer });
            } 
            else if (data.type === "answer") {
                await pc.setRemoteDescription(new RTCSessionDescription(data.answer));
            } 
            else if (data.type === "candidate") {
                await pc.addIceCandidate(new RTCIceCandidate(data.candidate));
            }
            else if (data.type === "hangup") {
                endCall(false);
            }
        }

        async function sendSignal(signal) {
            signal.user = myUsername;
            signal.isSignal = true; // Mark as RTC signal
            const enc = await encrypt(JSON.stringify(signal));
            ws.send(enc);
        }

        function endCall(notify = true) {
            if (notify) sendSignal({ type: "hangup" });
            if (pc) pc.close();
            if (localStream) localStream.getTracks().forEach(t => t.stop());
            document.getElementById("video-container").style.display = "none";
            pc = null;
        }

        // --- SESSION ---
        function joinSession() {
            myUsername = document.getElementById("usernameInput").value.trim() || "User";
            secretKey = document.getElementById("keyInput").value;
            if (!secretKey) return alert("Key required");
            if ("Notification" in window) Notification.requestPermission().then(updateStatusLight);

            const protocol = window.location.protocol === "https:" ? "wss://" : "ws://";
            ws = new WebSocket(`${protocol}${window.location.host}/ws`);
            ws.onopen = () => {
                document.getElementById("login-screen").style.display = "none";
                document.getElementById("main-container").style.display = "flex";
            };
            ws.onmessage = async (e) => {
                const dec = await decrypt(e.data);
                if (!dec) return;
                const data = JSON.parse(dec);
                if (data.isSignal) handleSignal(data);
                else if (data.type === "typing") {
                    document.getElementById("typing-indicator").innerText = `${data.user} is typing...`;
                    clearTimeout(typingTimeout);
                    typingTimeout = setTimeout(() => document.getElementById("typing-indicator").innerText = "", 2000);
                } else {
                    renderMessage(data.user, data.content, "partner-message", data.time, data.type, data.filename);
                    if (Notification.permission === "granted" && !document.hasFocus()) {
                        new Notification(data.user, { body: data.content });
                    }
                }
            };
        }

        // (Existing sendTextMessage, renderMessage, toggleSidebar code here...)
        // [Note: Make sure to include the file/audio/send logic from the previous version!]
        function toggleSidebar() { document.getElementById("sidebar").classList.toggle("minimized"); }
        async function sendTextMessage() {
            const input = document.getElementById("messageInput"), txt = input.value.trim();
            if (!txt) return;
            const time = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            const enc = await encrypt(JSON.stringify({ user: myUsername, content: txt, type: "text", time }));
            ws.send(enc);
            renderMessage("You", txt, "my-message", time, "text");
            input.value = "";
        }
        function renderMessage(user, content, className, time, type, filename) {
            const div = document.createElement("div");
            div.className = `message ${className}`;
            let body = `<strong>${user}:</strong> `;
            if (type === "text") body += content;
            else if (type === "image") body += `<br><img src="${content}" class="chat-img">`;
            else if (type === "audio") body += `<br><audio controls src="${content}"></audio>`;
            else body += `<br>📄 <a href="${content}" download="${filename}" style="color:var(--accent)">${filename}</a>`;
            div.innerHTML = `${body} <span class="timestamp">${time}</span>`;
            document.getElementById("messages").appendChild(div);
            document.getElementById("messages").scrollTop = document.getElementById("messages").scrollHeight;
        }
    </script>
</body>
</html>

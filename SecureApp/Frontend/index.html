<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Messenger Web Pro</title>
    <style>
        body { background-color: #1a1a1a; color: #ffffff; font-family: Arial, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .container { width: 100%; max-width: 650px; background-color: #2b2b2b; padding: 30px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.6); box-sizing: border-box; }
        h2 { text-align: center; margin-top: 0; color: #e0e0e0; }
        label { display: block; margin-bottom: 8px; font-weight: bold; color: #aaa; }
        input[type="text"], input[type="password"] { width: 100%; padding: 12px; margin-bottom: 20px; border-radius: 5px; border: 1px solid #555; background-color: #333; color: white; box-sizing: border-box; }
        button { padding: 12px; background-color: #1f538d; color: white; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; transition: 0.2s; }
        button:hover { background-color: #163d69; }
        #joinBtn { width: 100%; font-size: 16px; padding: 14px; }
        
        #chat-screen { display: none; }
        #messages { height: 450px; overflow-y: auto; background-color: #1e1e1e; padding: 15px; margin-bottom: 15px; border-radius: 5px; display: flex; flex-direction: column; gap: 10px; }
        
        .message { padding: 10px 15px; border-radius: 8px; max-width: 75%; word-wrap: break-word; }
        .my-message { background-color: #1f538d; align-self: flex-end; }
        .partner-message { background-color: #4a4a4a; align-self: flex-start; }
        .system-message { background-color: #555500; align-self: center; font-size: 0.85em; padding: 5px 10px; border-radius: 20px;}
        
        /* Media Styles */
        img.chat-img { max-width: 100%; border-radius: 5px; margin-top: 5px; }
        audio.chat-audio { width: 100%; margin-top: 5px; height: 35px; outline: none; }
        .file-link { color: #82b1ff; text-decoration: none; font-weight: bold; display: block; margin-top: 5px; }
        .file-link:hover { text-decoration: underline; }
        
        #input-area { display: flex; gap: 5px; }
        #input-area input { margin-bottom: 0; flex-grow: 1; }
        .icon-btn { width: 45px; font-size: 18px; padding: 0; display: flex; justify-content: center; align-items: center;}
        .recording { background-color: #a12525 !important; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }
    </style>
</head>
<body>

    <div id="login-screen" class="container">
        <h2>Secure Session Login</h2>
        <label>Username</label>
        <input type="text" id="usernameInput" placeholder="Enter your display name...">
        <label>Secret Auth Key</label>
        <input type="password" id="secretKeyInput" placeholder="Must match your partner's key...">
        <button id="joinBtn" onclick="joinSession()">Start Secure Session</button>
    </div>

    <div id="chat-screen" class="container">
        <h2 id="chat-header">Secure Chat</h2>
        <div id="messages"></div>
        <div id="input-area">
            <input type="file" id="fileInput" style="display: none;">
            <button class="icon-btn" onclick="document.getElementById('fileInput').click()" title="Send File/Image">📎</button>
            <button class="icon-btn" id="recordBtn" onclick="toggleRecording()" title="Hold to Record">🎤</button>
            <input type="text" id="messageInput" placeholder="Type a message..." autocomplete="off">
            <button onclick="sendTextMessage()">Send</button>
        </div>
    </div>

    <script>
        const loginScreen = document.getElementById("login-screen");
        const chatScreen = document.getElementById("chat-screen");
        const messagesDiv = document.getElementById("messages");
        const messageInput = document.getElementById("messageInput");
        const chatHeader = document.getElementById("chat-header");
        const recordBtn = document.getElementById("recordBtn");

        let myUsername = "";
        let secretKey = "";
        let ws = null;

        // --- AUDIO RECORDING VARIABLES ---
        let isRecording = false;
        let mediaRecorder;
        let audioChunks = [];

        function joinSession() {
            myUsername = document.getElementById("usernameInput").value.trim() || "Anonymous";
            secretKey = document.getElementById("secretKeyInput").value;
            if (!secretKey) { alert("You must enter a Secret Auth Key."); return; }

            loginScreen.style.display = "none";
            chatScreen.style.display = "block";
            chatHeader.innerText = `Connected as: ${myUsername}`;

            const protocol = window.location.protocol === "https:" ? "wss://" : "ws://";
            ws = new WebSocket(`${protocol}${window.location.host}/ws`);
            ws.onopen = () => renderMessage("System", "Connected to relay server.", "system-message");
            ws.onclose = () => renderMessage("System", "Disconnected from server.", "system-message");
            
            ws.onmessage = async function(event) {
                const decryptedText = await decryptMessage(event.data);
                if (!decryptedText) return; // Wrong key, ignore
                try {
                    const data = JSON.parse(decryptedText);
                    renderMessage(data.user, data.content, "partner-message", data.type, data.filename);
                } catch (e) { console.error("Malformed data"); }
            };
        }

        // --- CRYPTO ENGINE ---
        async function getEncryptionKey() {
            const enc = new TextEncoder();
            const keyMaterial = await crypto.subtle.importKey("raw", enc.encode(secretKey), {name: "PBKDF2"}, false, ["deriveKey"]);
            return crypto.subtle.deriveKey(
                { name: "PBKDF2", salt: enc.encode("secure-messenger-salt"), iterations: 100000, hash: "SHA-256" },
                keyMaterial, { name: "AES-GCM", length: 256 }, false, ["encrypt", "decrypt"]
            );
        }

        async function encryptMessage(text) {
            const key = await getEncryptionKey();
            const iv = crypto.getRandomValues(new Uint8Array(12));
            const encryptedBuffer = await crypto.subtle.encrypt({ name: "AES-GCM", iv: iv }, key, new TextEncoder().encode(text));
            const combined = new Uint8Array(iv.length + encryptedBuffer.byteLength);
            combined.set(iv, 0); combined.set(new Uint8Array(encryptedBuffer), iv.length);
            return btoa(String.fromCharCode(...combined));
        }

        async function decryptMessage(base64Str) {
            try {
                const key = await getEncryptionKey();
                const combined = new Uint8Array(atob(base64Str).split("").map(c => c.charCodeAt(0)));
                const decryptedBuffer = await crypto.subtle.decrypt({ name: "AES-GCM", iv: combined.slice(0, 12) }, key, combined.slice(12));
                return new TextDecoder().decode(decryptedBuffer);
            } catch (e) { return null; }
        }

        // --- SENDING LOGIC ---
        async function sendPayload(type, content, filename = "") {
            if (ws && ws.readyState === WebSocket.OPEN) {
                const payload = JSON.stringify({ user: myUsername, type: type, content: content, filename: filename });
                const encryptedData = await encryptMessage(payload);
                ws.send(encryptedData);
                renderMessage("You", content, "my-message", type, filename);
            }
        }

        function sendTextMessage() {
            const text = messageInput.value.trim();
            if (text) {
                sendPayload("text", text);
                messageInput.value = "";
            }
        }
        messageInput.addEventListener("keypress", (e) => { if (e.key === "Enter") sendTextMessage(); });

        // --- VOICE RECORDING LOGIC ---
        async function toggleRecording() {
            if (!isRecording) {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    mediaRecorder = new MediaRecorder(stream);
                    mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
                    mediaRecorder.onstop = async () => {
                        const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
                        const base64Audio = await blobToBase64(audioBlob);
                        sendPayload("audio", base64Audio);
                        audioChunks = []; // reset
                    };
                    mediaRecorder.start();
                    isRecording = true;
                    recordBtn.innerText = "⏹️";
                    recordBtn.classList.add("recording");
                } catch (err) { alert("Microphone access denied."); }
            } else {
                mediaRecorder.stop();
                isRecording = false;
                recordBtn.innerText = "🎤";
                recordBtn.classList.remove("recording");
            }
        }

        // --- FILE & IMAGE HANDLING ---
        document.getElementById('fileInput').addEventListener('change', async function() {
            const file = this.files[0];
            if (!file) return;

            if (file.type.startsWith('image/')) {
                // Compress images to mirror python thumbnail logic
                const compressedBase64 = await compressImage(file);
                sendPayload("image", compressedBase64, file.name);
            } else {
                // Prevent server crashes from massive generic files
                if (file.size > 10 * 1024 * 1024) {
                    alert("File too large! Max 10MB to prevent connection drop.");
                    this.value = ''; return;
                }
                const base64File = await blobToBase64(file);
                sendPayload("file", base64File, file.name);
            }
            this.value = ''; // Reset input
        });

        function compressImage(file) {
            return new Promise((resolve) => {
                const img = new Image();
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    const MAX_SIZE = 1280;
                    let width = img.width, height = img.height;

                    if (width > height && width > MAX_SIZE) { height *= MAX_SIZE / width; width = MAX_SIZE; } 
                    else if (height > MAX_SIZE) { width *= MAX_SIZE / height; height = MAX_SIZE; }

                    canvas.width = width; canvas.height = height;
                    const ctx = canvas.getContext("2d");
                    ctx.drawImage(img, 0, 0, width, height);
                    resolve(canvas.toDataURL("image/jpeg", 0.75)); // Compress to 75% quality JPEG
                };
                img.src = URL.createObjectURL(file);
            });
        }

        function blobToBase64(blob) {
            return new Promise((resolve) => {
                const reader = new FileReader();
                reader.onloadend = () => resolve(reader.result);
                reader.readAsDataURL(blob);
            });
        }

        // --- RENDERING UI ---
        function renderMessage(sender, content, className, type = "text", filename = "") {
            const msg = document.createElement("div");
            msg.className = `message ${className}`;
            
            let htmlContent = `<strong>${sender}:</strong><br>`;

            if (type === "text") {
                htmlContent += content;
            } else if (type === "audio") {
                htmlContent += `🎤 Voice Note<br><audio class="chat-audio" controls src="${content}"></audio>`;
            } else if (type === "image") {
                htmlContent += `<img class="chat-img" src="${content}"><br>
                                <a class="file-link" href="${content}" download="${filename}">💾 Download Image</a>`;
            } else if (type === "file") {
                htmlContent += `📁 Document<br>
                                <a class="file-link" href="${content}" download="${filename}">💾 Download ${filename}</a>`;
            }

            msg.innerHTML = htmlContent;
            messagesDiv.appendChild(msg);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }
    </script>
</body>
</html>

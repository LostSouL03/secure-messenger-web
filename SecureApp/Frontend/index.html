<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Messenger Pro</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="login-screen">
        <div class="login-box">
            <h2>Secure Login</h2>
            <input type="text" id="usernameInput" placeholder="Username">
            <input type="password" id="keyInput" placeholder="Secret Auth Key">
            <button id="loginBtn" class="primary-btn">ENTER</button>
        </div>
    </div>

    <div id="main-container" style="display: none;">
        <div id="sidebar">
            <div class="sidebar-header">
                <div class="header-center">
                    <span>CHATS <small id="relay-badge">🔒 Secure</small></span>
                </div>
                <div class="search-container">
                    <input type="text" id="contactSearch" placeholder="Search contacts...">
                </div>
            </div>
            
            <div id="contact-list"></div>

            <div class="sidebar-footer">
                <button id="gear-btn" onclick="openSettings()">⚙️ Settings</button>
            </div>
        </div>
        
        <div id="chat-window">
            <div class="chat-header">
                <span id="active-chat-user"></span>
                <button id="callBtn" class="call-trigger" style="display: none;">📞 Call</button>
            </div>
            <div id="messages"></div>
            <div class="input-area">
                <button class="icon-btn" id="attachBtn">📎</button>
                <input type="file" id="fileInput" style="display:none">
                <button class="icon-btn" id="recordBtn">🎤</button>
                <input type="text" id="messageInput" placeholder="Type a message">
                <button id="sendBtn" class="send-btn">SEND</button>
            </div>
        </div>
    </div>

    <div id="settings-overlay" class="overlay">
        <div class="settings-box">
            <h3>System Settings</h3>
            <div class="setting-row">
                <span>Light Mode</span>
                <label class="switch">
                    <input type="checkbox" id="theme-toggle">
                    <span class="slider"></span>
                </label>
            </div>
            <button onclick="logout()" class="settings-btn danger-btn">Logout</button>
            <button onclick="closeSettings()" class="settings-btn primary-btn">Close</button>
        </div>
    </div>

    <script src="encryption.js"></script>
    <script src="app.js"></script>
</body>
</html>

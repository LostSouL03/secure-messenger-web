<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Messenger Pro</title>
    <link rel="stylesheet" href="styles.css?v=3">
</head>
<body>
    <div id="video-container" style="display:none;">
        <video id="remoteVideo" autoplay playsinline></video>
        <video id="localVideo" autoplay playsinline muted></video>
        <div class="call-controls">
            <button id="hangupBtn" class="danger-btn">End Call</button>
        </div>
    </div>

    <div id="login-screen">
        <div class="bg-shape shape-1"></div>
        <div class="bg-shape shape-2"></div>
        <div class="login-box">
            <div class="lock-icon">
                <svg viewBox="0 0 24 24" width="40" height="40" stroke="currentColor" stroke-width="2" fill="none"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path></svg>
            </div>
            <h2>Secure Access</h2>
            <p>End-to-End Encrypted Node</p>
            <input type="text" id="usernameInput" placeholder="Username" autocomplete="off">
            <input type="password" id="keyInput" placeholder="Secret Auth Key">
            <button id="loginBtn" class="primary-btn">Enter Secure Relay</button>
        </div>
    </div>

    <div id="main-container" style="display: none;">
        <div id="sidebar">
            <div class="sidebar-header">
                <div class="header-left">
                    <div class="my-avatar"></div>
                    <span class="chats-title">CHATS <small id="relay-badge">🔒</small></span>
                </div>
                <div class="header-right">
                    <button id="add-contact-btn" onclick="promptAddContact()" title="New Chat">➕</button>
                    <button id="gear-btn" onclick="openSettings()" title="Settings">⚙️</button>
                </div>
            </div>
            
            <div class="search-container">
                <div class="search-box">
                    <span class="search-icon">🔍</span>
                    <input type="text" id="contactSearch" placeholder="Search or start new chat">
                </div>
            </div>
            
            <div id="contact-list"></div>
        </div>
        
        <div id="chat-window">
            <div id="empty-state" class="empty-state">
                <div class="empty-state-content">
                    <h3>Secure Messenger for Web</h3>
                    <p>Select a contact from the left sidebar to start messaging with end-to-end encryption.</p>
                </div>
            </div>

            <div id="active-chat-area" style="display: none; height: 100%; flex-direction: column;">
                <div class="chat-header">
                    <div class="chat-header-info">
                        <div class="chat-avatar" id="active-chat-avatar"></div>
                        <div class="chat-header-text">
                            <span id="active-chat-user"></span>
                            <small id="active-chat-status"></small>
                        </div>
                    </div>
                    <button id="callBtn" class="call-trigger">📞</button>
                </div>
                
                <div id="messages"></div>
                
                <div class="input-area">
                    <button class="icon-btn" id="attachBtn" title="Attach">📎</button>
                    <input type="file" id="fileInput" style="display:none">
                    
                    <input type="text" id="messageInput" placeholder="Type a message">
                    
                    <button class="icon-btn" id="recordBtn" title="Voice Message">🎤</button>
                    <button class="icon-btn" id="sendBtn" style="display: none;" title="Send">➤</button>
                </div>
            </div>
        </div>
    </div>

    <div id="settings-overlay" class="overlay">
        <div class="settings-box">
            <h3>System Settings</h3>
            <div class="setting-row">
                <span>Light Mode</span>
                <label class="switch">
                    <input type="checkbox" id="theme-toggle">
                    <span class="slider"></span>
                </label>
            </div>
            <button onclick="logout()" class="settings-btn danger-btn">Logout</button>
            <button onclick="closeSettings()" class="settings-btn outline-btn">Close</button>
        </div>
    </div>

    <script src="encryption.js"></script>
    <script src="app.js?v=3"></script>
</body>
</html>

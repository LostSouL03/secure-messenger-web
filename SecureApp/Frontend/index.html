<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Messenger Pro</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="video-container">
        <video id="remoteVideo" autoplay playsinline></video>
        <video id="localVideo" autoplay playsinline muted></video>
        <button id="hangupBtn">✖</button>
    </div>

    <div id="login-screen">
        <div class="login-box">
            <h2>Secure Login</h2>
            <input type="text" id="usernameInput" placeholder="Username">
            <input type="password" id="keyInput" placeholder="Secret Auth Key">
            <button id="loginBtn" class="primary-btn">ENTER</button>
        </div>
    </div>

    <div id="main-container">
        <div id="sidebar">
            <div class="sidebar-header">CHATS</div>
            <div class="sidebar-item">🔒 Secure Relay</div>
        </div>
        <div id="chat-window">
            <div class="chat-header">
                <span id="chat-title">Active Room</span>
                <button id="callBtn" class="call-trigger">📞 Call</button>
            </div>
            <div id="messages"></div>
            <div class="input-area">
                <button class="icon-btn" id="attachBtn">📎</button>
                <input type="file" id="fileInput" style="display:none">
                <button class="icon-btn" id="recordBtn">🎤</button>
                <input type="text" id="messageInput" placeholder="Type a message">
                <button id="sendBtn" class="send-btn">SEND</button>
            </div>
        </div>
    </div>

    <script src="encryption.js"></script>
    <script src="app.js"></script>
</body>
</html>
